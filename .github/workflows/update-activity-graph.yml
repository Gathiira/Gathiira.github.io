name: Update activity graph

on:
  schedule:
    # 03:17 UTC daily — off the hour to avoid GitHub Actions' load spikes.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate activity-graph.svg
        run: node scripts/generate-activity-graph.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- images/activity-graph.svg; then
            echo "No change in contribution data — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/activity-graph.svg
          git commit -m "chore: refresh activity graph"
          git push
